name: CI

on:
  push:
  pull_request:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trading_copilot
      AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Check undefined names
        run: make lint
      - name: Type-check configured modules
        working-directory: backend
        run: mypy --config-file mypy.ini
        # The strict baseline currently reports unrelated errors outside this scope.
        continue-on-error: true
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        if: always()
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        if: always()
        run: npm run build
