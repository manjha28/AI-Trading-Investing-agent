services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/AI-Trading-Investing-agent:cached
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/trading_copilot
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: trading_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d trading_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: