# Fly.io frontend app. Replace finbyte-nexus as in backend.fly.toml.
app = "finbyte-nexus-web"
primary_region = "sin"        # Singapore: the nearest region to India that offers Managed Postgres (bom does not)

[build]
  dockerfile = "frontend.Dockerfile"

[env]
  BACKEND_HOST = "finbyte-nexus-api.internal"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
