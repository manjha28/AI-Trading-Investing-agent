# Development overrides: publish service ports on loopback only.
services:
  kafka:
    ports:
      - "127.0.0.1:${KAFKA_DEV_PORT:-9092}:9092"
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_DEV_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

  valkey:
    ports:
      - "127.0.0.1:${VALKEY_DEV_PORT:-6379}:6379"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432"
